command:
  - streamlit
  - run
  - app.py

env:
  # SQL warehouse fourni par la ressource de l'App (CAN_USE)
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  # Endpoint de modèle par défaut (ressource serving endpoint, CAN_QUERY)
  - name: AI_STUDIO_DEFAULT_MODEL
    valueFrom: default-model
  - name: AI_STUDIO_CATALOG
    value: dataops_dev
  - name: AI_STUDIO_SCHEMA
    value: ai_studio
  # Zone de données des agents : list_tables sans paramètre et HakimAI listent ce schéma, tables préfixées data_
  - name: AI_STUDIO_DATA_CATALOG
    value: dataops_dev
  - name: AI_STUDIO_DATA_SCHEMA
    value: ai_studio
  - name: AI_STUDIO_DATA_PREFIX
    value: data_
  - name: AI_STUDIO_MAX_ROWS
    value: "200"
  # URL du flux Power Automate Smart Office (ressource secret, lecture seule)
  - name: POWER_AUTOMATE_SMART_OFFICE_URL
    valueFrom: smart-office-flow
  # Administrateurs des outils : seuls habilités à publier un outil qui écrit ou envoie des données
  - name: AI_STUDIO_TOOL_ADMINS
    value: "phsi10251@commun.ad.sncf.fr"
  # Copilote HakimAI : "false" le désactive sans redéploiement du code
  - name: AI_STUDIO_HAKIM_ENABLED
    value: "true"
  # Administrateurs des équipes : seuls habilités à publier une équipe d'agents
  - name: AI_STUDIO_TEAM_ADMINS
    value: "phsi10251@commun.ad.sncf.fr"
  # HakimAI Voix (prototype gpt-realtime, lecture seule) : désactivé tant que la clé, le réseau et l'accord
  # sécurité ne sont pas en place. La clé vient de la ressource secret « openai-key » (jamais en clair ici).
  - name: AI_STUDIO_VOICE_ENABLED
    value: "false"
  # À décommenter APRÈS avoir ajouté la ressource secret « openai-key » à l'App (sinon le déploiement échoue).
  # - name: OPENAI_API_KEY
  #   valueFrom: openai-key
  - name: AI_STUDIO_VOICE_MODEL
    value: gpt-realtime
  - name: AI_STUDIO_VOICE_MAX_SECONDS
    value: "300"
  - name: AI_STUDIO_VOICE_MAX_TOOL_CALLS
    value: "20"
  - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
    value: "false"
