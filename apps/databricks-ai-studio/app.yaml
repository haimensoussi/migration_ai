command:
  - streamlit
  - run
  - app.py

env:
  # SQL warehouse fourni par la ressource de l'App (CAN_USE)
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  # Endpoint de modèle par défaut (ressource serving endpoint, CAN_QUERY)
  - name: AI_STUDIO_DEFAULT_MODEL
    valueFrom: default-model
  - name: AI_STUDIO_CATALOG
    value: dataops_dev
  - name: AI_STUDIO_SCHEMA
    value: ai_studio
  - name: AI_STUDIO_MAX_ROWS
    value: "200"
  # URL du flux Power Automate Smart Office (ressource secret, lecture seule)
  - name: POWER_AUTOMATE_SMART_OFFICE_URL
    valueFrom: smart-office-flow
  - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
    value: "false"
