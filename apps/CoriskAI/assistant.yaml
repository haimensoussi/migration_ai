# Manifeste d'assistant HORIZON -> Databricks (format pivot, version 1), paquet « fonctions ».
# Construit sur le code d'origine CORISK.IA du dossier actions/ : fonctions Python simples (pas d'Actions HORIZON
# RunContext). Ce manifeste ne fait que déclarer le rôle de chaque fichier ; tout le reste est lu dans le code.
format_version: 1
name: corisk_analyse_risques
description: >
  Analyste des risques projets SNCF Réseau (CORISK.IA) : répond à une question à partir des documents PDF d'un
  projet (risques étayés, probabilité, impact, criticité, mitigation, pages citées).
source_kind: functions
objects_prefix: corisk               # préfixe des objets Unity Catalog créés (à valider)

# Fonction qui appelle le LLM : devient l'agent (code recopié dans agent.py, transformations tracées)
agent:
  file: actions/agent_risk_chat.py
  entrypoint: agent_risk_chat
  env:
    # Variable lue par la source (os.environ) ; sa valeur n'est pas dans le code : à confirmer
    DATABRICKS_LLM_ENDPOINT: databricks-claude-sonnet-4-6

# Configuration de la source (nom affiché, prompt) : lue pour information
config:
  file: actions/build_agent_risk.py
  entrypoint: build_agent_risk

# Chaîne d'indexation : devient l'indexation du Job (analyse des PDF, découpage, table des segments, index)
indexing:
  - file: actions/ingest_project.py
    entrypoint: ingest_project
  - file: actions/extract_project_pdf.py
    entrypoint: extract_project_pdf

tests_file: tests/cas_attendus.yaml

# Pas de section dependencies : documents et index vectoriel sont déduits du code d'indexation et de l'agent
# (colonnes, filtre project_id, découpage, 12 passages), créés et vérifiés par le Job au déploiement.
# Rangement des documents : <Volume>/<project_id>/<fichier>.pdf
