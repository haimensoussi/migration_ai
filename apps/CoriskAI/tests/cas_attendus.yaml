# Résultats attendus, calculés à la main. Grille de criticité de DÉMONSTRATION (à valider) :
# 1-4 faible, 5-9 modéré, 10-14 élevé, 15-25 critique.
actions:
  calculer_criticite:
    - name: p3_i4
      inputs: {probabilite: 3, impact: 4}
      expect: {criticite: 12, niveau: élevé}
    - name: minimum
      inputs: {probabilite: 1, impact: 1}
      expect: {criticite: 1, niveau: faible}
    - name: borne_faible
      inputs: {probabilite: 2, impact: 2}
      expect: {criticite: 4, niveau: faible}
    - name: borne_basse_modere
      inputs: {probabilite: 1, impact: 5}
      expect: {criticite: 5, niveau: modéré}
    - name: borne_modere
      inputs: {probabilite: 3, impact: 3}
      expect: {criticite: 9, niveau: modéré}
    - name: borne_basse_eleve
      inputs: {probabilite: 2, impact: 5}
      expect: {criticite: 10, niveau: élevé}
    - name: borne_basse_critique
      inputs: {probabilite: 3, impact: 5}
      expect: {criticite: 15, niveau: critique}
    - name: maximum
      inputs: {probabilite: 5, impact: 5}
      expect: {criticite: 25, niveau: critique}
    - name: notes_en_texte
      inputs: {probabilite: "4", impact: "2"}
      expect: {criticite: 8, niveau: modéré}
    - name: probabilite_zero
      inputs: {probabilite: 0, impact: 3}
      expect_error: INVALID_PROBABILITE
    - name: probabilite_texte
      inputs: {probabilite: "forte", impact: 3}
      expect_error: INVALID_PROBABILITE
    - name: impact_trop_grand
      inputs: {probabilite: 2, impact: 6}
      expect_error: INVALID_IMPACT
    - name: impact_absent
      inputs: {probabilite: 2}
      expect_error: INVALID_IMPACT
  # Contrôles d'entrée uniquement : ils échouent avant tout accès à l'index. Les cas nominaux de recherche seront
  # ajoutés quand l'index Vector Search existera, avec un PDF de projet de test validé.
  rechercher_passages:
    - name: question_vide
      inputs: {question: "  ", project_id: P001}
      expect_error: MISSING_QUESTION
    - name: projet_absent
      inputs: {question: "Risques de délai"}
      expect_error: INVALID_PROJECT
    - name: projet_chemin
      inputs: {question: "Risques de délai", project_id: "../P001"}
      expect_error: INVALID_PROJECT
    - name: top_k_zero
      inputs: {question: "Risques de délai", project_id: P001, top_k: 0}
      expect_error: INVALID_TOP_K
    - name: top_k_texte
      inputs: {question: "Risques de délai", project_id: P001, top_k: "beaucoup"}
      expect_error: INVALID_TOP_K

conversations:
  - name: criticite_seule
    question: "Un risque a une probabilité de 3 et un impact de 4. Quelle est sa criticité et son niveau ?"
    expect_actions: [calculer_criticite]
    expect_in_answer: "12"
  - name: deux_risques
    question: "Calcule la criticité de deux risques : A (probabilité 2, impact 5) et B (probabilité 5, impact 4)."
    expect_actions: [calculer_criticite, calculer_criticite]
    expect_in_answer: "20"
  - name: note_invalide
    question: "Quelle est la criticité d'un risque de probabilité 7 et d'impact 2 ? Utilise l'outil de calcul."
    expect_actions: [calculer_criticite]
    expect_tool_error: INVALID_PROBABILITE
  - name: sans_projet
    question: "Bonjour, que sais-tu faire ?"
    expect_actions: []
