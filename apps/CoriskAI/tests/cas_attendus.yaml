# Tests de l'agent migré, issus du comportement du code d'origine (origin: source) ou d'un ajout de la migration
# (origin: migration). Les passages sont fournis directement (context_chunks), comme le fait l'appelant de
# agent_risk_chat : ces cas ne demandent pas d'index. Contenus FICTIFS, pour test uniquement.
# expect : égalité sur les sorties ; expect_count : nombre d'éléments ; expect_answer : réponse du LLM non vide ;
# expect_error : message d'erreur attendu.
cases:
  - name: question_vide
    origin: source                 # agent_risk_chat : ValueError('Question vide')
    question: "   "
    custom_inputs:
      context_chunks: [{file_name: test_fictif.pdf, page: 1, content: "Texte fictif."}]
    expect_error: Question vide
  - name: sources_et_question
    origin: source                 # sortie : question reprise, sources = file_name et page de chaque passage
    question: Quels risques ressortent de ce projet ?
    custom_inputs:
      context_chunks:
        - {file_name: test_fictif.pdf, page: 1, content: "Document fictif de test. Les travaux de nuit sont limités à trois semaines."}
        - {file_name: test_fictif.pdf, page: 3, content: "Document fictif de test. La livraison des rails est annoncée avec un mois de retard."}
    expect:
      question: Quels risques ressortent de ce projet ?
      sources: [{file_name: test_fictif.pdf, page: 1}, {file_name: test_fictif.pdf, page: 3}]
    expect_answer: true
  - name: limite_12_passages
    origin: source                 # context_chunks[:12] : 12 passages au plus envoyés au LLM et cités
    question: Résume les informations disponibles.
    custom_inputs:
      context_chunks:
        - {file_name: test_fictif.pdf, page: 1, content: "Passage fictif 1."}
        - {file_name: test_fictif.pdf, page: 2, content: "Passage fictif 2."}
        - {file_name: test_fictif.pdf, page: 3, content: "Passage fictif 3."}
        - {file_name: test_fictif.pdf, page: 4, content: "Passage fictif 4."}
        - {file_name: test_fictif.pdf, page: 5, content: "Passage fictif 5."}
        - {file_name: test_fictif.pdf, page: 6, content: "Passage fictif 6."}
        - {file_name: test_fictif.pdf, page: 7, content: "Passage fictif 7."}
        - {file_name: test_fictif.pdf, page: 8, content: "Passage fictif 8."}
        - {file_name: test_fictif.pdf, page: 9, content: "Passage fictif 9."}
        - {file_name: test_fictif.pdf, page: 10, content: "Passage fictif 10."}
        - {file_name: test_fictif.pdf, page: 11, content: "Passage fictif 11."}
        - {file_name: test_fictif.pdf, page: 12, content: "Passage fictif 12."}
        - {file_name: test_fictif.pdf, page: 13, content: "Passage fictif 13."}
        - {file_name: test_fictif.pdf, page: 14, content: "Passage fictif 14."}
    expect_count:
      sources: 12
    expect_answer: true
  - name: projet_requis_pour_la_recherche
    origin: migration              # recherche ajoutée : sans context_chunks, project_id est obligatoire
    question: Quels sont les risques ?
    custom_inputs: {}
    expect_error: project_id requis
